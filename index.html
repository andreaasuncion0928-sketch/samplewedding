<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elena & Adrian — A Love Story</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Poppins:wght@300;400;500&family=Allura&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM
       ========================================================================== */
    @font-face {
      font-family: 'Brittany';
      src: local('Brittany Signature'), local('BrittanySignature');
    }

    :root {
      --white: #FFFFFF;
      --off-white: #FAFAFA;
      --black: #111111;
      --gray: #666666;
      --card-bg: #EAE6DF;
      --card-border: #D8D2C9;
      --text-muted: #7A7570;
      
      --font-serif: 'Didot', 'Bodoni MT', 'Cormorant Garamond', serif;
      --font-sans: 'Poppins', sans-serif;
      --font-script: 'Brittany', 'Allura', cursive;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--white);
      color: var(--black);
      font-family: var(--font-sans);
      line-height: 1.8;
      overflow-x: hidden;
    }

    h1, h2, h3, .serif { font-family: var(--font-serif); font-weight: 400; }
    .script { font-family: var(--font-script); font-size: 2.5rem; color: var(--black); font-weight: normal; }
    
    a { color: inherit; text-decoration: none; cursor: pointer; transition: all 0.3s ease; }
    button { font-family: var(--font-sans); cursor: pointer; border: none; background: none; }

    /* ==========================================================================
       2. SCREEN SWAPPING TRICK
       ========================================================================== */
    .screen {
      display: none;
      min-height: 100vh;
      background-color: var(--white);
      animation: fadeIn 0.8s ease forwards;
    }
    
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container { max-width: 850px; margin: 0 auto; padding: 5rem 1.5rem 4rem; position: relative; z-index: 1;}
    .text-center { text-align: center; }

    /* Buttons */
    .btn {
      display: inline-block; padding: 1rem 3rem; background-color: var(--black); color: var(--white);
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase; border: 1px solid var(--black); transition: all 0.4s ease;
    }
    .btn:hover { background-color: transparent; color: var(--black); }

    .back-btn {
      display: inline-block; margin-top: 4rem; font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gray); border-bottom: 1px solid transparent; padding-bottom: 4px; transition: all 0.3s ease;
    }
    .back-btn:hover { color: var(--black); border-bottom-color: var(--black); letter-spacing: 4px; }

    /* ==========================================================================
       3. COVER SCREEN
       ========================================================================== */
    #screen-cover {
      background-color: var(--black);
      position: relative;
    }

    .cover-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('cover.jpeg');
      background-size: cover;
      background-position: center;
      opacity: 0.45;
      z-index: 1;
    }

    .cover-content {
      position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; 
      justify-content: center; text-align: center; min-height: 100vh; padding: 4rem 2rem; color: #FFF;
    }

    .cover-subtitle {
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 6px;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 2rem;
    }

    .cover-names { 
      font-family: var(--font-serif); 
      font-size: clamp(48px, 8vw, 92px); 
      line-height: 1.05; 
      color: #FFF; 
      margin-bottom: 2rem; 
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .cover-date { 
      font-size: clamp(10px, 1.8vw, 12px); 
      letter-spacing: 5px; 
      color: rgba(255, 255, 255, 0.85); 
      text-transform: uppercase; 
      margin-bottom: 3.5rem; 
      font-weight: 300; 
    }

    .cover-btn { 
      background-color: transparent; 
      color: #FFF; 
      border: 1px solid rgba(255, 255, 255, 0.65); 
      padding: 1rem 3.2rem;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      transition: all 0.4s ease;
      font-weight: 300;
    }
    .cover-btn:hover { 
      background-color: #FFF; 
      color: #000; 
      border-color: #FFF;
    }

    /* ==========================================================================
       4. MENU / WELCOME SCREEN
       ========================================================================== */
    #screen-menu { 
      position: relative;
      background-color: var(--black); 
    }
    
    #screen-menu::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('welcome.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: 0;
    }

    #screen-menu::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.65); 
      z-index: 0;
    }
    
    .menu-header { margin-bottom: 4rem; text-align: center; color: var(--white); }
    .menu-header .script { color: var(--white); }
    .menu-header h2 { font-size: 2rem; letter-spacing: 2px; color: var(--white); }
    .menu-header p { font-size: 12px; letter-spacing: 4px; color: rgba(255, 255, 255, 0.7); text-transform: uppercase; margin-top: 0.5rem;}
    
    .elegant-menu { display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; color: var(--white); }
    
    .elegant-item { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 2.5rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
      cursor: pointer; transition: all 0.4s ease; text-align: left;
    }
    .elegant-item:first-child { border-top: 1px solid rgba(255, 255, 255, 0.2); }
    .elegant-item:hover { transform: translateX(10px); }
    
    .ei-num { font-family: var(--font-serif); font-size: 1.4rem; font-style: italic; color: rgba(255, 255, 255, 0.5); width: 40px; }
    .ei-text { flex-grow: 1; padding: 0 1.5rem; }
    .ei-title { font-family: var(--font-serif); font-size: 26px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 0.3rem; color: var(--white); }
    .ei-desc { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); font-family: var(--font-sans); }
    .ei-arrow { font-size: 18px; color: rgba(255, 255, 255, 0.5); transition: all 0.3s; }
    .elegant-item:hover .ei-arrow { color: var(--white); transform: translateX(5px); }

    /* ==========================================================================
       5. OUR STORY SCREEN
       ========================================================================== */
    #screen-story {
      position: relative;
      background-color: var(--white);
    }
    
    #screen-story::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('ourstory.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: 0;
    }

    #screen-story::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.75); 
      z-index: 0;
    }

    .story-content { 
      max-width: 520px; 
      margin: 0 auto; 
      text-align: center; 
      font-family: var(--font-serif); 
      font-size: 19px; 
      color: #111111; 
      line-height: 1.9; 
      font-weight: 400; 
      letter-spacing: 0.5px; 
    }

    .story-content p { 
      margin-bottom: 2rem; 
    }
    
    .story-highlight-italics {
      font-style: italic;
      color: var(--black);
      font-size: 24px;
      font-weight: 500; 
      line-height: 1.4;
      margin-bottom: 2rem !important;
    }

    .story-script-accent {
      font-family: var(--font-script);
      font-size: clamp(3.2rem, 8vw, 4.2rem);
      margin: 2.5rem 0;
      color: var(--black);
      line-height: 1.1;
    }

    .story-married-text {
      font-style: italic;
      color: var(--black);
      font-size: 24px;
      font-weight: 500;
      margin-top: 2.5rem;
      margin-bottom: 3rem;
    }
    
    .story-bottom { 
      margin-top: 4.5rem; 
      border-top: 1px solid rgba(0,0,0,0.15); 
      padding-top: 3.5rem; 
    }

    /* ==========================================================================
       6. THE DAY SCREEN
       ========================================================================== */
    #screen-day {
      position: relative;
      background-color: #E2DBD4;
      color: var(--black);
    }

    #screen-day::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('atglance.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      opacity: 0.25;
      z-index: 0;
    }

    .day-header-tag {
      font-size: 10px;
      letter-spacing: 5px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .day-main-title {
      font-family: var(--font-serif);
      font-size: clamp(32px, 5vw, 46px);
      letter-spacing: 6px;
      font-weight: 400;
      text-transform: uppercase;
      color: #222;
      margin-bottom: 1.2rem;
    }

    .day-sub-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 17px;
      color: #444;
      line-height: 1.4;
      margin-bottom: 3.5rem;
    }

    .arch-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      align-items: start;
      max-width: 820px;
      margin: 0 auto;
    }

    .arch-card {
      background: rgba(236, 232, 226, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 180px 180px 8px 8px;
      padding: 3rem 1.8rem 2.5rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      position: relative;
      transition: all 0.5s ease;
    }

    .arch-card.expanded {
      border-radius: 12px;
      padding: 2rem 1.5rem;
      background: rgba(238, 234, 228, 0.94);
    }
