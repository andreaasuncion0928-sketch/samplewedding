<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elena & Adrian — A Love Story</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Poppins:wght@300;400;500;600;700&family=Allura&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM & BASE ANIMATIONS (Lavender & Black Theme)
       ========================================================================== */
    @font-face {
      font-family: 'Brittany';
      src: local('Brittany Signature'), local('BrittanySignature');
    }

    :root {
      --white: #FFFFFF;
      --off-white: #FAFAFA;
      --black: #111111;
      --gray: #666666;
      --card-bg: #EAE6DF;
      --card-border: #D8D2C9;
      --text-muted: #8E7A99;
      --lavender: #9A84A1;
      --lavender-light: #D4A8F0;
      
      --font-serif: 'Didot', 'Bodoni MT', 'Cormorant Garamond', serif;
      --font-sans: 'Poppins', sans-serif;
      --font-script: 'Brittany', 'Allura', cursive;

      --ease-out-cubic: cubic-bezier(0.215, 0.61, 0.355, 1);
      --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.25, 1, 0.35, 1);
      --ease-ultra-slow: cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--white);
      color: var(--black);
      font-family: var(--font-sans);
      line-height: 1.8;
      overflow-x: hidden;
      width: 100%;
    }

    h1, h2, h3, .serif { font-family: var(--font-serif); font-weight: 400; color: var(--black); }
    .script { font-family: var(--font-script); font-size: 2.5rem; color: var(--lavender); font-weight: normal; }
    
    a { color: inherit; text-decoration: none; cursor: pointer; transition: all 0.3s var(--ease-smooth); }
    button { font-family: var(--font-sans); cursor: pointer; border: none; background: none; outline: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes coverEntrance {
      0% { opacity: 0; transform: translateY(40px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes floatLight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes scaleZoomBg {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* KEYFRAME FOR BLUR-TO-FOCUS FADE ANIMATION */
    @keyframes blurFocusEntry {
      0% {
        opacity: 0;
        filter: blur(12px);
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }
    }

    /* ELEGANT TYPEWRITER CHARACTER FADE ANIMATION */
    .char-fade {
      display: inline-block;
      opacity: 0;
      transform: translateY(4px);
      animation: charFadeUp 0.35s cubic-bezier(0.25, 1, 0.35, 1) forwards;
    }

    .word-wrap {
      display: inline-block;
      white-space: nowrap;
    }

    @keyframes charFadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.9s var(--ease-smooth), transform 0.9s var(--ease-smooth);
      will-change: opacity, transform;
    }

    .reveal-on-scroll.is-revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       2. SCREEN SWAPPING & CONTAINERS
       ========================================================================== */
    .screen {
      display: none;
      min-height: 100vh;
      background-color: var(--white);
      animation: fadeIn 0.8s var(--ease-smooth) forwards;
      width: 100%;
    }
    
    .screen.active {
      display: block;
    }

    .container { 
      max-width: 850px; 
      margin: 0 auto; 
      padding: 3.5rem 1.25rem 4rem; 
      position: relative; 
      z-index: 1;
      width: 100%;
    }
    .text-center { text-align: center; }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.8rem;
      background-color: var(--black);
      color: var(--white);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      border: 1px solid var(--black);
      position: relative;
      overflow: hidden;
      z-index: 1;
      max-width: 100%;
      transition: color 0.4s var(--ease-smooth), border-color 0.4s var(--ease-smooth), transform 0.3s var(--ease-smooth);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--lavender-light);
      z-index: -1;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.4s var(--ease-smooth);
    }

    .btn:hover {
      color: var(--black);
      border-color: var(--lavender);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(154, 132, 161, 0.3);
    }

    .btn:hover::before {
      transform: scaleX(1);
      transform-origin: left;
    }

    .map-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 1rem;
      padding: 0.8rem 1.8rem;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--black);
      background: var(--white);
      border: 1px solid var(--black);
      transition: all 0.3s var(--ease-smooth);
      max-width: 100%;
    }

    .map-btn:hover {
      background: var(--black);
      color: var(--lavender-light);
      border-color: var(--black);
      transform: translateY(-2px);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 3.5rem;
      padding: 0.85rem 2.2rem;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--black);
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--black);
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      position: relative;
      z-index: 10;
      max-width: 100%;
      transition: all 0.3s var(--ease-smooth);
    }
    
    .back-btn:hover {
      color: var(--white);
      background: var(--black);
      border-color: var(--black);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    /* ==========================================================================
       3. COVER SCREEN
       ========================================================================== */
    #screen-cover {
      background-color: var(--black);
      position: relative;
      overflow: hidden;
    }

    .cover-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('cover.jpeg');
      background-size: cover;
      background-position: center;
      opacity: 0.45;
      z-index: 1;
      animation: scaleZoomBg 20s infinite alternate var(--ease-smooth);
    }

    .cover-content {
      position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; 
      justify-content: center; text-align: center; min-height: 100vh; padding: 4rem 1.25rem; color: #FFF;
      animation: coverEntrance 1.4s var(--ease-out-cubic) forwards;
    }

    .cover-subtitle {
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 6px;
      color: var(--lavender-light);
      text-transform: uppercase;
      font-weight: 300;
      margin-bottom: 2rem;
      animation: floatLight 4s infinite ease-in-out;
    }

    .cover-names { 
      font-family: var(--font-serif); 
      font-size: clamp(38px, 8vw, 92px); 
      line-height: 1.05; 
      color: #FFF; 
      margin-bottom: 2rem; 
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      word-wrap: break-word;
    }

    .cover-date { 
      font-size: clamp(10px, 1.8vw, 12px); 
      letter-spacing: 5px; 
      color: rgba(255, 255, 255, 0.85); 
      text-transform: uppercase; 
      margin-bottom: 3.5rem; 
      font-weight: 300; 
    }

    .cover-btn { 
      background-color: transparent; 
      color: #FFF; 
      border: 1px solid rgba(212, 168, 240, 0.65); 
      padding: 1rem 2.2rem;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.4s var(--ease-smooth);
      font-weight: 300;
      backdrop-filter: blur(4px);
    }

    .cover-btn:hover { 
      background-color: #FFF; 
      color: var(--black); 
      border-color: #FFF;
      box-shadow: 0 10px 25px rgba(212, 168, 240, 0.3);
    }

    /* ==========================================================================
       4. MENU / WELCOME SCREEN & REFINED MINIMALIST ODOMETER
       ========================================================================== */
    #screen-menu { 
      position: relative;
      background-color: var(--black); 
    }
    
    #screen-menu::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('welcome.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: 0;
      animation: scaleZoomBg 25s infinite alternate var(--ease-smooth);
    }

    #screen-menu::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(17, 17, 17, 0.68); 
      z-index: 0;
    }

    .countdown-display-wrap {
      margin-bottom: 1.5rem;
      padding-top: 0.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .odometer-window {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      height: clamp(65px, 14vw, 130px);
      overflow: hidden;
      font-family: var(--font-serif);
      font-size: clamp(60px, 14vw, 130px);
      font-weight: 300;
      font-style: italic;
      color: var(--lavender-light);
      line-height: 1;
      padding: 0 4px;
      max-width: 100%;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .odometer-digit-column {
      display: inline-block;
      height: clamp(65px, 14vw, 130px);
      overflow: hidden;
      position: relative;
    }

    .odometer-digit-strip {
      display: flex;
      flex-direction: column;
      transform: translateY(0%);
      will-change: transform;
    }

    .odometer-digit-strip span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: clamp(65px, 14vw, 130px);
      width: clamp(35px, 9vw, 80px);
      line-height: 1;
      text-align: center;
    }

    .countdown-subtext {
      font-size: clamp(8px, 1.4vw, 10px);
      letter-spacing: clamp(4px, 1.5vw, 8px);
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 300;
      margin-top: 1rem;
      text-indent: 4px;
    }
    
    .menu-header { margin-bottom: 2.2rem; text-align: center; color: var(--white); margin-top: 1.2rem; }
    .menu-header h2 { font-size: clamp(1.4rem, 3.5vw, 2rem); letter-spacing: 4px; color: var(--white); text-transform: uppercase; font-weight: 300; }
    .menu-header p { font-size: 11px; letter-spacing: 5px; color: var(--lavender-light); text-transform: uppercase; margin-top: 0.4rem;}
    
    .elegant-menu { display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; color: var(--white); width: 100%; }
    
    .elegant-item { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 1.5rem 0.5rem; border-bottom: 1px solid rgba(212, 168, 240, 0.25); 
      cursor: pointer; transition: all 0.4s var(--ease-smooth); text-align: left;
      position: relative;
      width: 100%;
    }

    .elegant-item::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; width: 0%; height: 1px;
      background-color: var(--lavender-light);
      transition: width 0.4s var(--ease-smooth);
    }

    .elegant-item:first-child { border-top: 1px solid rgba(212, 168, 240, 0.25); }
    .elegant-item:hover { transform: translateX(6px); background: rgba(154, 132, 161, 0.08); }
    .elegant-item:hover::after { width: 100%; }
    
    .ei-text { flex-grow: 1; padding: 0 0.5rem; }
    .ei-title { font-family: var(--font-serif); font-size: clamp(18px, 3.5vw, 24px); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 0.2rem; color: var(--white); }
    .ei-desc { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); font-family: var(--font-sans); }
    .ei-arrow { font-size: 16px; color: var(--lavender); transition: all 0.3s var(--ease-smooth); }
    .elegant-item:hover .ei-arrow { color: var(--lavender-light); transform: translateX(5px); }

    /* ==========================================================================
       5. OUR STORY SCREEN
       ========================================================================== */
    #screen-story {
      position: relative;
      background-color: var(--white);
    }
    
    #screen-story::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('ourstory.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      z-index: 0;
    }

    #screen-story::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.8); 
      z-index: 0;
    }

    /* PREVENT MID-WORD SPLITTING & WRAP ISSUES */
    .story-content { 
      max-width: 580px; 
      margin: 0 auto; 
      text-align: center; 
      font-family: var(--font-serif); 
      font-size: clamp(16px, 3.5vw, 19px); 
      color: var(--black); 
      line-height: 1.8; 
      font-weight: 400; 
      letter-spacing: 0.5px; 
      min-height: 320px;
      width: 100%;
      word-break: normal;
      overflow-wrap: break-word;
      hyphens: manual;
    }

    .story-content p { 
      margin-bottom: 1.8rem; 
      color: var(--black);
      word-break: normal;
      overflow-wrap: break-word;
    }
    
    .story-highlight-italics {
      font-style: italic;
      color: var(--black);
      font-size: clamp(20px, 4vw, 24px);
      font-weight: 500; 
      line-height: 1.4;
      margin-bottom: 1.8rem !important;
    }

    /* BLUR-TO-FOCUS FADE ANIMATION FOR "WE BECAME US" */
    .story-script-accent {
      font-family: var(--font-script);
      font-size: clamp(2.8rem, 8vw, 4.2rem);
      margin: 2rem 0;
      color: var(--lavender);
      line-height: 1.1;
      opacity: 0;
      will-change: filter, opacity, transform;
    }

    .story-script-accent.blur-focus-visible {
      animation: blurFocusEntry 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .story-married-text {
      font-style: italic;
      color: var(--black);
      font-size: clamp(20px, 4vw, 24px);
      font-weight: 500;
      margin-top: 2rem;
      margin-bottom: 2.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.5s var(--ease-smooth), transform 1.5s var(--ease-smooth);
    }

    .story-married-text.fade-in-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .typing-cursor::after {
      content: '|';
      font-weight: 300;
      color: var(--lavender);
      margin-left: 2px;
      animation: cursorBlink 0.8s infinite;
    }

    #story-join-btn-wrap {
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: opacity 1.2s var(--ease-smooth), transform 1.2s var(--ease-smooth);
      margin-top: 1.5rem;
    }

    #story-join-btn-wrap.btn-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    
    .story-bottom { 
      margin-top: 3rem; 
      border-top: 1px solid rgba(154, 132, 161, 0.25); 
      padding-top: 2rem; 
    }

    .story-bottom .serif-year {
      font-size: 18px; 
      margin-bottom: 0.1rem; 
      font-weight: 300;
      color: var(--lavender);
      letter-spacing: 2px;
    }

    .story-bottom .tag-sub {
      font-size: 9px; 
      letter-spacing: 3px; 
      text-transform: uppercase; 
      color: var(--text-muted); 
      margin-bottom: 0.5rem;
    }

    .story-bottom .motto-p {
      color: var(--gray); 
      font-style: italic; 
      margin-bottom: 1.2rem; 
      font-family: var(--font-serif); 
      font-size: 13px;
      font-weight: 300;
    }

    .story-bottom .script-names {
      font-size: 1.8rem;
      color: var(--lavender);
      font-weight: 300;
    }

    /* ==========================================================================
       6. THE DAY SCREEN
       ========================================================================== */
    #screen-day {
      position: relative;
      background-color: var(--off-white);
      color: var(--black);
    }

    #screen-day::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('atglance.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      opacity: 0.55; 
      z-index: 0;
    }

    #screen-day::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.10);
      z-index: 0;
    }

    .day-header-tag {
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--lavender);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .day-main-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 5vw, 46px);
      letter-spacing: 5px;
      font-weight: 400;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 1.2rem;
    }

    .day-sub-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 16px;
      color: var(--gray);
      line-height: 1.4;
      margin-bottom: 2.5rem;
    }

    .arch-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.8rem;
      align-items: start;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }

    .arch-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(154, 132, 161, 0.3);
      border-radius: 180px 180px 8px 8px;
      padding: 3rem 1.2rem 2.2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      position: relative;
      transition: all 0.5s var(--ease-smooth);
      width: 100%;
    }

    .arch-card:hover {
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 20px 40px rgba(154, 132, 161, 0.18);
    }

    .arch-card.expanded {
      border-radius: 12px;
      padding: 2rem 1.2rem;
      background: rgba(255, 255, 255, 0.97);
      transform: none !important;
    }

    .arch-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 1rem;
      display: block;
      opacity: 0.85;
      stroke: var(--lavender);
    }

    .arch-category {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--lavender);
      margin-bottom: 0.5rem;
    }

    .arch-venue-title {
      font-family: var(--font-serif);
      font-size: clamp(20px, 4vw, 24px);
      color: var(--black);
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }

    .arch-location {
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 1.8rem;
      letter-spacing: 1px;
    }

    .arch-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.8rem 1.4rem;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--black);
      border: 1px solid var(--lavender);
      background: transparent;
      border-radius: 2px;
      transition: all 0.4s var(--ease-smooth);
      max-width: 100%;
    }

    .arch-btn:hover {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }

    .close-card-btn {
      position: absolute;
      top: 15px;
      right: 18px;
      font-size: 20px;
      color: var(--gray);
      cursor: pointer;
      line-height: 1;
      display: none;
    }

    .arch-card.expanded .close-card-btn { display: block; }
    .arch-card.expanded .arch-icon { display: none; }
    .arch-card.expanded .arch-btn { display: none; }

    .arch-expanded-content {
      display: none;
      animation: fadeIn 0.5s ease forwards;
    }

    .arch-card.expanded .arch-expanded-content {
      display: block;
    }

    .arch-preview-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      margin: 1rem 0 1.5rem;
    }

    .arch-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.3rem;
      border-top: 1px solid rgba(154, 132, 161, 0.2);
      padding-top: 1rem;
      margin-bottom: 1.2rem;
    }

    .meta-col { text-align: center; }

    .meta-icon {
      width: 16px;
      height: 16px;
      margin: 0 auto 0.3rem;
      display: block;
      opacity: 0.8;
      stroke: var(--lavender);
    }

    .meta-title {
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--black);
      font-weight: 500;
    }

    .meta-sub {
      font-size: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--gray);
    }

    .arch-bottom-motto {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 14px;
      color: var(--gray);
      margin-bottom: 1rem;
    }

    .schedule-toggle-card {
      margin-top: 3rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(154, 132, 161, 0.3);
      border-radius: 8px;
      padding: 1.5rem 1.2rem;
      cursor: pointer;
      transition: all 0.4s var(--ease-smooth);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
      max-width: 820px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .schedule-toggle-card:hover {
      background: rgba(255, 255, 255, 0.98);
      border-color: var(--black);
      transform: translateY(-3px);
    }

    .schedule-toggle-title {
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--black);
    }

    .wedding-timeline-wrap {
      display: none;
      position: relative;
      max-width: 800px;
      margin: 2.5rem auto 1rem;
      padding: 2rem 0;
      animation: fadeIn 0.6s ease forwards;
      width: 100%;
    }

    .wedding-timeline-wrap.active {
      display: block;
    }

    .timeline-title-script {
      font-family: var(--font-script);
      font-size: clamp(3rem, 7vw, 4.5rem);
      color: var(--black);
      margin-bottom: 2.5rem;
      text-align: center;
      line-height: 1;
    }

    .timeline-center-line {
      position: absolute;
      top: 100px;
      bottom: 20px;
      left: 50%;
      width: 1px;
      background-color: var(--lavender);
      transform: translateX(-50%);
      z-index: 1;
    }

    .timeline-node-item {
      position: relative;
      display: flex;
      width: 100%;
      margin-bottom: 3.5rem;
      align-items: flex-start;
      z-index: 2;
    }

    .timeline-node-dot {
      position: absolute;
      left: 50%;
      top: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--white);
      border: 1px solid var(--lavender);
      transform: translateX(-50%);
      z-index: 3;
    }

    .timeline-node-content {
      width: 50%;
      padding: 0 2rem;
    }

    .timeline-node-item.left-node {
      justify-content: flex-start;
    }
    .timeline-node-item.left-node .timeline-node-content {
      text-align: right;
      padding-right: 2.5rem;
    }

    .timeline-node-item.right-node {
      justify-content: flex-end;
    }
    .timeline-node-item.right-node .timeline-node-content {
      text-align: left;
      padding-left: 2.5rem;
    }

    .node-event-title {
      font-family: var(--font-script);
      font-size: clamp(2.2rem, 4.5vw, 3.2rem);
      color: var(--black);
      line-height: 1;
      margin-bottom: 0.4rem;
    }

    .node-event-time {
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--lavender);
      font-weight: 500;
      margin-bottom: 0.8rem;
    }

    .node-event-desc {
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gray);
      line-height: 1.8;
      max-width: 320px;
      display: inline-block;
    }

    /* ==========================================================================
       7. ENTOURAGE SCREEN
       ========================================================================== */
    #screen-entourage {
      position: relative;
      background-color: var(--white);
      color: var(--black);
    }

    #screen-entourage::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('entourage.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      opacity: 0.75;
      z-index: 0;
      animation: scaleZoomBg 25s infinite alternate var(--ease-smooth);
    }

    #screen-entourage::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.45);
      z-index: 0;
    }

    .entourage-header-tag {
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--lavender);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 2;
    }

    .entourage-main-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: 5px;
      font-weight: 400;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 1rem;
      line-height: 1.15;
      position: relative;
      z-index: 2;
    }

    .entourage-sub-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 16px;
      color: #333333;
      line-height: 1.5;
      margin-bottom: 3rem;
      position: relative;
      z-index: 2;
    }

    .entourage-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .entourage-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(154, 132, 161, 0.35);
      border-radius: 12px;
      padding: 2.2rem 1.5rem;
      text-align: center;
      transition: all 0.4s var(--ease-smooth);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .entourage-card:hover {
      border-color: var(--lavender);
      background: rgba(255, 255, 255, 0.96);
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(154, 132, 161, 0.22);
    }

    .entourage-card-full {
      grid-column: span 2;
    }

    .entourage-role-title {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--lavender);
      margin-bottom: 1rem;
      font-weight: 600;
      border-bottom: 1px solid rgba(154, 132, 161, 0.25);
      padding-bottom: 0.5rem;
      display: inline-block;
    }

    .entourage-person-name {
      font-family: var(--font-serif);
      font-size: clamp(16px, 3.2vw, 21px);
      color: var(--black);
      margin-bottom: 0.3rem;
      font-weight: 400;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       8. DETAILS SCREEN
       ========================================================================== */
    #screen-details {
      position: relative;
      background-color: var(--white);
      color: var(--black);
    }
    
    #screen-details::before {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('details.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      opacity: 0.75;
      z-index: 0;
      animation: scaleZoomBg 25s infinite alternate var(--ease-smooth);
    }

    #screen-details::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.45);
      z-index: 0;
    }

    .details-header-tag {
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--lavender);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 2;
    }

    .details-main-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: 5px;
      font-weight: 400;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 1rem;
      line-height: 1.15;
      position: relative;
      z-index: 2;
    }

    .details-sub-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 16px;
      color: #333333;
      line-height: 1.5;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 2;
    }

    .details-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 1.2rem; 
      max-width: 820px; 
      margin: 0 auto; 
      position: relative; 
      z-index: 2; 
      width: 100%;
    }
    
    .detail-card { 
      background: rgba(255, 255, 255, 0.88); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(154, 132, 161, 0.35); 
      border-radius: 120px 150px 8px 8px;
      padding: 3rem 1rem 2rem; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.4s var(--ease-smooth); 
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      width: 100%;
    }

    .detail-card:hover { 
      border-color: var(--lavender); 
      background: rgba(255, 255, 255, 0.96); 
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 35px rgba(154, 132, 161, 0.22);
    }
    
    .detail-title { 
      font-family: var(--font-serif); 
      font-size: clamp(18px, 3.5vw, 24px); 
      font-weight: 400; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
      margin-bottom: 0.5rem; 
      color: var(--black);
      line-height: 1.2;
    }

    .detail-sub { 
      font-size: 10px; 
      letter-spacing: 1.5px; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      font-weight: 400; 
    }

    .detail-content { 
      display: none; 
      text-align: left; 
      max-width: 600px; 
      margin: 0 auto; 
      animation: fadeIn 0.4s forwards; 
      background: rgba(255, 255, 255, 0.92); 
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 2.5rem 1.5rem; 
      border: 1px solid rgba(154, 132, 161, 0.35); 
      border-radius: 12px;
      position: relative;
      z-index: 2;
      color: var(--black);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      width: 100%;
    }
    .detail-content.active { display: block; }
    
    .dc-header { 
      font-family: var(--font-serif); 
      font-size: clamp(26px, 5vw, 36px); 
      font-weight: 300; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
      margin-bottom: 1.2rem; 
      text-align: center; 
      border-bottom: 1px solid rgba(154, 132, 161, 0.25); 
      padding-bottom: 1.2rem;
      color: var(--black);
    }

    .detail-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(154, 132, 161, 0.2);
      gap: 5px;
    }

    .detail-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--black);
      border: 1px solid rgba(154, 132, 161, 0.4);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      transition: all 0.3s var(--ease-smooth);
    }

    .detail-nav-btn:hover {
      color: var(--white);
      background: var(--black);
      border-color: var(--black);
    }

    .faq-q { 
      width: 100%; 
      text-align: left; 
      padding: 1.2rem 0; 
      font-family: var(--font-serif); 
      font-size: 18px; 
      font-weight: 400; 
      display: flex; 
      justify-content: space-between; 
      border-bottom: 1px solid rgba(154, 132, 161, 0.25); 
      letter-spacing: 1px; 
      color: var(--black); 
    }

    .faq-a { 
      max-height: 0; 
      overflow: hidden; 
      transition: max-height 0.4s var(--ease-smooth), padding 0.4s var(--ease-smooth); 
      font-size: 13px; 
      font-weight: 300; 
      color: var(--gray); 
      line-height: 1.7; 
    }
    .faq-item.open .faq-a { max-height: 250px; padding: 1.2rem 0; }

    /* Action Links/Buttons for Wedding Fund */
    .registry-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
      align-items: center;
    }

    .registry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 380px;
      padding: 0.9rem 1.5rem;
      background: rgba(154, 132, 161, 0.1);
      border: 1px solid rgba(154, 132, 161, 0.4);
      color: var(--black);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 30px;
      transition: all 0.3s var(--ease-smooth);
    }

    .registry-btn:hover {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
      transform: translateY(-2px);
    }

    /* ==========================================================================
       9. GALLERY SCREEN (10 Photos Stacked Gallery)
       ========================================================================== */
    #screen-gallery {
      background-color: var(--off-white);
      color: var(--black);
      padding: 0 0 6rem;
      position: relative;
    }

    .gallery-heading-wrap {
      text-align: center;
      padding: 4rem 1.5rem 3rem;
    }

    .gallery-heading {
      font-family: var(--font-serif);
      font-size: clamp(18px, 4vw, 26px);
      letter-spacing: 5px;
      text-transform: uppercase;
      font-weight: 300;
      color: var(--black);
    }

    .stacked-gallery-container {
      position: relative;
      max-width: 750px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .stacked-card {
      position: sticky;
      top: 90px;
      margin-bottom: 30vh;
      background: var(--white);
      padding: 0.6rem 0.6rem 1rem;
      border: 1px solid rgba(154, 132, 161, 0.2);
      border-radius: 6px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, top;
    }

    .stacked-card:nth-child(1)  { transform: rotate(0deg); }
    .stacked-card:nth-child(2)  { transform: rotate(-1.5deg); }
    .stacked-card:nth-child(3)  { transform: rotate(1.2deg); }
    .stacked-card:nth-child(4)  { transform: rotate(-2deg); }
    .stacked-card:nth-child(5)  { transform: rotate(1.8deg); }
    .stacked-card:nth-child(6)  { transform: rotate(-1.2deg); }
    .stacked-card:nth-child(7)  { transform: rotate(2deg); }
    .stacked-card:nth-child(8)  { transform: rotate(-1.8deg); }
    .stacked-card:nth-child(9)  { transform: rotate(1.5deg); }
    .stacked-card:nth-child(10) { transform: rotate(-0.8deg); }

    .stacked-card:hover {
      transform: scale(1.01) rotate(0deg) !important;
      z-index: 99 !important;
      box-shadow: 0 25px 50px rgba(154, 132, 161, 0.25);
    }

    .gal-img-wrapper {
      width: 100%;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--off-white);
      overflow: hidden;
      border-radius: 4px;
    }

    .gal-img-wrapper img {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      display: block;
    }

    .gallery-footer {
      padding: 4rem 1.5rem 3rem;
      text-align: center;
      position: relative;
      z-index: 100;
    }

    .rsvp-form {
      max-width: 480px;
      margin: 0 auto;
      text-align: left;
      width: 100%;
    }

    .form-group {
      margin-bottom: 1.8rem;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 0.5rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid var(--card-border);
      background: var(--off-white);
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--black);
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--lavender);
    }

    .rsvp-success {
      display: none;
      animation: fadeIn 0.8s var(--ease-smooth) forwards;
    }

    /* ==========================================================================
       10. RESPONSIVE BREAKPOINTS
       ========================================================================== */
    @media (max-width: 768px) {
      .container { padding: 2.2rem 1rem 3rem; }
      .details-grid { grid-template-columns: 1fr; gap: 1rem; }
      .arch-cards-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .entourage-grid { grid-template-columns: 1fr; gap: 1.2rem; }
      .entourage-card-full { grid-column: span 1; }
      
      .timeline-center-line { left: 15px; }
      .timeline-node-dot { left: 15px; }
      .timeline-node-item.left-node,
      .timeline-node-item.right-node {
        justify-content: flex-start;
      }
      .timeline-node-item.left-node .timeline-node-content,
      .timeline-node-item.right-node .timeline-node-content {
        width: 100%;
        text-align: left;
        padding-left: 2.2rem;
        padding-right: 0.5rem;
      }

      .stacked-card { top: 75px; margin-bottom: 22vh; }
      .odometer-digit-strip span { width: clamp(30px, 8vw, 50px); }
      .btn { padding: 0.85rem 1.8rem; font-size: 9px; letter-spacing: 3px; }
      
      .detail-nav-bar { flex-wrap: wrap; justify-content: center; gap: 8px; }
      .detail-nav-btn { font-size: 8px; padding: 0.4rem 0.8rem; }
    }
  </style>
</head>

      <h2 class="serif reveal-on-scroll" style="font-size: 42px; margin-bottom: 3.5rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 300;">Our Story</h2>

      </div>

      <div class="menu-header reveal-on-scroll">
        <h2 class="serif">Elena & Adrian</h2>
        <p>31 · 0
